<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素化工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>图像像素化工具</h1>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <p>拖拽图像到此处，或点击上传</p>
                <p class="hint">支持 PNG、JPG 格式</p>
                <img id="previewImg" class="preview-img" src="" alt="预览">
            </div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">
            <div class="error" id="error"></div>
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">处理中...</p>
            </div>
        </div>

        <div class="pipeline-section" id="pipelineSection">
            <div class="pipeline-title">
                <input type="text" id="pipelineName" value="默认管线" placeholder="管线名称" maxlength="30">
            </div>
            <div class="pipeline-toolbar">
                <div class="dropdown" id="addPipeDropdown">
                    <button class="toolbar-btn" id="addPipeBtn">+ 添加步骤</button>
                    <div class="dropdown-menu" id="addPipeMenu"></div>
                </div>
                <div class="dropdown" id="presetDropdown">
                    <button class="toolbar-btn" id="presetBtn">预设模板</button>
                    <div class="dropdown-menu" id="presetMenu"></div>
                </div>
                <div class="toolbar-sep"></div>
                <button class="toolbar-btn primary" id="executeAllBtn" disabled>执行全部</button>
                <div class="toolbar-sep"></div>
                <div class="dropdown" id="savedConfigDropdown">
                    <button class="toolbar-btn" id="savedConfigBtn">我的配置</button>
                    <div class="dropdown-menu" id="savedConfigMenu"></div>
                </div>
                <button class="toolbar-btn" id="saveConfigBtn">保存配置</button>
                <div class="save-form" id="saveForm">
                    <input type="text" id="saveConfigName" placeholder="配置名称" maxlength="30">
                    <button class="confirm-btn" id="saveConfirmBtn">保存</button>
                    <button class="cancel-btn" id="saveCancelBtn">取消</button>
                </div>
                <div style="flex:1;"></div>
                <button class="toolbar-btn" id="importBtn">导入</button>
                <button class="toolbar-btn" id="exportBtn">导出</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none;">
                <div class="toolbar-sep"></div>
                <button class="toolbar-btn danger" id="resetBtn">重置默认</button>
            </div>
            <div class="pipeline-flow" id="pipelineFlow"></div>
        </div>

        <div class="batch-section" id="batchSection">
            <div class="section-header">
                <h2>Batch 批量配置</h2>
                <div class="batch-selector">
                    <select id="batchSelect"></select>
                    <button class="toolbar-btn" id="newBatchBtn">新建</button>
                    <button class="toolbar-btn danger" id="deleteBatchBtn">删除</button>
                </div>
            </div>
            <div class="batch-meta" id="batchMeta">
                <input type="text" id="batchName" placeholder="Batch 名称" maxlength="30">
                <label class="tile-label">瓦片: <input type="number" id="batchTileSize" value="16" min="8" max="64"> px</label>
            </div>
            <div class="batch-toolbar" id="batchToolbar">
                <div class="dropdown">
                    <button class="toolbar-btn" id="addBatchConfigBtn">+ 添加配置</button>
                    <div class="dropdown-menu" id="addBatchConfigMenu"></div>
                </div>
                <button class="toolbar-btn" id="importBatchBtn">导入</button>
                <button class="toolbar-btn" id="exportBatchBtn">导出 JSON</button>
                <input type="file" id="importBatchFileInput" accept=".json" style="display:none;">
                <div style="flex:1;"></div>
                <button class="toolbar-btn primary" id="executeBatchBtn" disabled>执行预览</button>
            </div>
            <div class="batch-configs" id="batchConfigs"></div>
            <div class="batch-preview" id="batchPreview" style="display:none;">
                <div class="collage-bar">
                    <span>拼图预览</span>
                    <div class="zoom-row">
                        <button id="collageZoomOut">-</button>
                        <span class="zoom-val" id="collageZoomVal">100%</span>
                        <button id="collageZoomIn">+</button>
                        <button id="collageZoomReset">重置</button>
                    </div>
                    <button class="toolbar-btn" id="downloadCollageBtn">下载拼图</button>
                </div>
                <div class="collage-viewport" id="collageViewport">
                    <canvas id="collageCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
