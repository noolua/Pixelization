<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .upload-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #007aff;
            background: #f0f7ff;
        }

        .upload-area p {
            color: #666;
            margin-bottom: 10px;
        }

        .upload-area .hint {
            font-size: 14px;
            color: #999;
        }

        .upload-area.has-file {
            border-style: solid;
            padding: 10px;
        }

        .upload-area.has-file p,
        .upload-area.has-file .hint {
            display: none;
        }

        .upload-area .preview-img {
            display: none;
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
        }

        .upload-area.has-file .preview-img {
            display: block;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        select {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            padding: 10px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result-section {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .result-section.show {
            display: block;
        }

        .image-compare {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .image-box {
            text-align: center;
        }

        .image-box h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .image-box img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .error.show {
            display: block;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图像像素化工具</h1>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <p>拖拽图像到此处，或点击上传</p>
                <p class="hint">支持 PNG、JPG 格式</p>
                <img id="previewImg" class="preview-img" src="" alt="预览">
            </div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">

            <div class="controls">
                <div class="control-group">
                    <label for="cellSize">像素化程度:</label>
                    <select id="cellSize">
                        <option value="2">2 (轻微)</option>
                        <option value="3">3</option>
                        <option value="4" selected>4 (中等)</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8 (强烈)</option>
                    </select>
                </div>
                <button id="processBtn" disabled>处理图像</button>
            </div>

            <div class="error" id="error"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>处理中...</p>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="image-compare">
                <div class="image-box">
                    <h3>原图</h3>
                    <img id="originalImage" src="" alt="原图">
                </div>
                <div class="image-box">
                    <h3>像素化结果</h3>
                    <img id="resultImage" src="" alt="像素化结果">
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const cellSize = document.getElementById('cellSize');
        const processBtn = document.getElementById('processBtn');
        const resultSection = document.getElementById('resultSection');
        const previewImg = document.getElementById('previewImg');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        let selectedFile = null;

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                resultSection.classList.remove('show');
                showPreview(selectedFile);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    selectedFile = file;
                    resultSection.classList.remove('show');
                    showPreview(file);
                } else {
                    showError('请选择有效的图像文件');
                }
            }
        });

        // 显示预览
        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                originalImage.src = e.target.result;
                uploadArea.classList.add('has-file');
                processBtn.disabled = false;
                hideError();
            };
            reader.readAsDataURL(file);
        }

        // 处理图像
        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            hideError();
            loading.classList.add('show');
            processBtn.disabled = true;

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('cell_size', cellSize.value);

            try {
                const response = await fetch('/pixelize', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '处理失败');
                }

                const blob = await response.blob();
                const resultUrl = URL.createObjectURL(blob);
                resultImage.src = resultUrl;
                resultSection.classList.add('show');

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('show');
                processBtn.disabled = false;
            }
        });

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        function hideError() {
            error.classList.remove('show');
        }
    </script>
</body>
</html>
