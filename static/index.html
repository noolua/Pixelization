<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .upload-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #007aff;
            background: #f0f7ff;
        }

        .upload-area p {
            color: #666;
            margin-bottom: 10px;
        }

        .upload-area .hint {
            font-size: 14px;
            color: #999;
        }

        .upload-area.has-file {
            border-style: solid;
            padding: 10px;
        }

        .upload-area.has-file p,
        .upload-area.has-file .hint {
            display: none;
        }

        .upload-area .preview-img {
            display: none;
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
        }

        .upload-area.has-file .preview-img {
            display: block;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-weight: 500;
            color: #333;
        }

        select {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            padding: 10px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result-section {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .result-section.show {
            display: block;
        }

        .image-compare {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .image-box {
            text-align: center;
        }

        .image-box h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .image-box img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .image-box img.pixelated-preview {
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .image-viewport {
            overflow: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            max-height: 500px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            justify-content: center;
        }

        .zoom-controls button {
            padding: 4px 12px;
            font-size: 16px;
            line-height: 1;
            min-width: 32px;
        }

        .zoom-controls .zoom-level {
            font-size: 13px;
            color: #666;
            min-width: 40px;
            text-align: center;
        }

        .download-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background: #34c759;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            text-align: center;
            display: inline-block;
        }

        .download-btn:hover {
            background: #28a745;
        }

        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .optimize-btn {
            margin-top: 15px;
            padding: 10px 24px;
            background: #ff9500;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
        }

        .optimize-btn:hover {
            background: #e08600;
        }

        .optimize-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .color-info {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .error.show {
            display: block;
        }

        input[type="file"] {
            display: none;
        }

        .bg-unify-section {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .bg-unify-section.show {
            display: block;
        }

        .bg-unify-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
        }

        .bg-unify-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .bg-unify-controls {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .bg-unify-controls.show {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .bg-unify-controls input[type="range"] {
            width: 120px;
            cursor: pointer;
        }

        .bg-unify-controls .tolerance-val {
            font-size: 13px;
            color: #666;
            min-width: 30px;
        }

        .bg-unify-preview {
            display: none;
            margin-top: 12px;
            text-align: center;
        }

        .bg-unify-preview.show {
            display: block;
        }

        .bg-unify-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .bg-unify-preview .label {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>图像像素化工具</h1>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <p>拖拽图像到此处，或点击上传</p>
                <p class="hint">支持 PNG、JPG 格式</p>
                <img id="previewImg" class="preview-img" src="" alt="预览">
            </div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">

            <div class="bg-unify-section" id="bgUnifySection">
                <label class="bg-unify-toggle">
                    <input type="checkbox" id="bgUnifyToggle">
                    启用背景色统一
                </label>
                <div class="bg-unify-controls" id="bgUnifyControls">
                    <div class="control-group">
                        <label for="bgTolerance">容差:</label>
                        <input type="range" id="bgTolerance" min="1" max="20" step="0.5" value="5.0">
                        <span class="tolerance-val" id="bgToleranceVal">5.0</span>
                    </div>
                    <div class="control-group">
                        <label for="bgTargetColor">目标色:</label>
                        <input type="color" id="bgTargetColor" value="#808080"
                               style="width:40px;height:32px;padding:2px;cursor:pointer;border:1px solid #ddd;border-radius:4px;">
                    </div>
                    <button id="bgUnifyBtn" disabled>统一背景</button>
                </div>
                <div class="bg-unify-preview" id="bgUnifyPreview">
                    <img id="bgUnifyPreviewImg" src="" alt="背景统一预览">
                    <p class="label">背景统一预览</p>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="cellSize">像素化程度:</label>
                    <select id="cellSize">
                        <option value="2">2 (轻微)</option>
                        <option value="3">3</option>
                        <option value="4" selected>4 (中等)</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8 (强烈)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="targetColors">目标颜色数:</label>
                    <input type="number" id="targetColors" value="32" min="2" max="256"
                           style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;width:80px;">
                </div>
                <button id="processBtn" disabled>处理图像</button>
            </div>

            <div class="error" id="error"></div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>处理中...</p>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="image-compare">
                <div class="image-box">
                    <h3>原图</h3>
                    <div class="zoom-controls">
                        <button onclick="zoom('originalImage', -1)">-</button>
                        <span class="zoom-level" id="zoom-originalImage">100%</span>
                        <button onclick="zoom('originalImage', 1)">+</button>
                        <button onclick="zoom('originalImage', 0)">重置</button>
                    </div>
                    <div class="image-viewport">
                        <img id="originalImage" src="" alt="原图">
                    </div>
                </div>
                <div class="image-box" id="unifiedBox" style="display:none;">
                    <h3>背景统一</h3>
                    <div class="zoom-controls">
                        <button onclick="zoom('unifiedImage', -1)">-</button>
                        <span class="zoom-level" id="zoom-unifiedImage">100%</span>
                        <button onclick="zoom('unifiedImage', 1)">+</button>
                        <button onclick="zoom('unifiedImage', 0)">重置</button>
                    </div>
                    <div class="image-viewport">
                        <img id="unifiedImage" src="" alt="背景统一结果">
                    </div>
                </div>
                <div class="image-box">
                    <h3>像素化结果</h3>
                    <div class="zoom-controls">
                        <button onclick="zoom('resultImage', -1)">-</button>
                        <span class="zoom-level" id="zoom-resultImage">100%</span>
                        <button onclick="zoom('resultImage', 1)">+</button>
                        <button onclick="zoom('resultImage', 0)">重置</button>
                    </div>
                    <div class="image-viewport">
                        <img id="resultImage" class="pixelated-preview" src="" alt="像素化结果">
                    </div>
                    <p class="color-info" id="colorInfo"></p>
                    <div style="text-align: center;">
                        <button id="optimizeBtn" class="optimize-btn" disabled>颜色优化</button>
                        <button id="downloadBtn" class="download-btn">下载原始尺寸</button>
                    </div>
                </div>
                <div class="image-box" id="optimizedBox" style="display:none;">
                    <h3>颜色优化结果</h3>
                    <div class="zoom-controls">
                        <button onclick="zoom('optimizedImage', -1)">-</button>
                        <span class="zoom-level" id="zoom-optimizedImage">100%</span>
                        <button onclick="zoom('optimizedImage', 1)">+</button>
                        <button onclick="zoom('optimizedImage', 0)">重置</button>
                    </div>
                    <div class="image-viewport">
                        <img id="optimizedImage" class="pixelated-preview" src="" alt="颜色优化结果">
                    </div>
                    <p class="color-info" id="optimizedColorInfo"></p>
                    <div style="text-align: center;">
                        <button id="downloadOptimizedBtn" class="download-btn">下载优化图像</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const cellSize = document.getElementById('cellSize');
        const targetColors = document.getElementById('targetColors');
        const processBtn = document.getElementById('processBtn');
        const resultSection = document.getElementById('resultSection');
        const previewImg = document.getElementById('previewImg');
        const originalImage = document.getElementById('originalImage');
        const resultImage = document.getElementById('resultImage');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const downloadBtn = document.getElementById('downloadBtn');
        const optimizeBtn = document.getElementById('optimizeBtn');
        const optimizedBox = document.getElementById('optimizedBox');
        const optimizedImage = document.getElementById('optimizedImage');
        const downloadOptimizedBtn = document.getElementById('downloadOptimizedBtn');
        const colorInfo = document.getElementById('colorInfo');
        const optimizedColorInfo = document.getElementById('optimizedColorInfo');

        let selectedFile = null;
        let pixelatedBlob = null;
        let optimizedBlob = null;
        let unifiedBlob = null;

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                resultSection.classList.remove('show');
                showPreview(selectedFile);
            }
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    selectedFile = file;
                    resultSection.classList.remove('show');
                    showPreview(file);
                } else {
                    showError('请选择有效的图像文件');
                }
            }
        });

        // 显示预览
        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                originalImage.src = e.target.result;
                uploadArea.classList.add('has-file');
                processBtn.disabled = false;
                document.getElementById('bgUnifySection').classList.add('show');
                // 重置背景统一状态
                unifiedBlob = null;
                document.getElementById('bgUnifyToggle').checked = false;
                document.getElementById('bgUnifyControls').classList.remove('show');
                document.getElementById('bgUnifyPreview').classList.remove('show');
                document.getElementById('bgUnifyBtn').disabled = true;
                hideError();
            };
            reader.readAsDataURL(file);
        }

        // 背景统一 toggle
        const bgUnifyToggle = document.getElementById('bgUnifyToggle');
        const bgUnifyControls = document.getElementById('bgUnifyControls');
        const bgTolerance = document.getElementById('bgTolerance');
        const bgToleranceVal = document.getElementById('bgToleranceVal');
        const bgTargetColor = document.getElementById('bgTargetColor');
        const bgUnifyBtn = document.getElementById('bgUnifyBtn');
        const bgUnifyPreview = document.getElementById('bgUnifyPreview');
        const bgUnifyPreviewImg = document.getElementById('bgUnifyPreviewImg');
        const unifiedBox = document.getElementById('unifiedBox');
        const unifiedImage = document.getElementById('unifiedImage');

        bgUnifyToggle.addEventListener('change', () => {
            bgUnifyControls.classList.toggle('show', bgUnifyToggle.checked);
            bgUnifyBtn.disabled = !bgUnifyToggle.checked;
            if (!bgUnifyToggle.checked) {
                bgUnifyPreview.classList.remove('show');
                unifiedBlob = null;
            }
        });

        bgTolerance.addEventListener('input', () => {
            bgToleranceVal.textContent = parseFloat(bgTolerance.value).toFixed(1);
        });

        bgUnifyBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            bgUnifyBtn.disabled = true;
            bgUnifyBtn.textContent = '处理中...';

            const formData = new FormData();
            formData.append('image', selectedFile);
            formData.append('tolerance', bgTolerance.value);
            formData.append('target_color', bgTargetColor.value);

            try {
                const response = await fetch('/unify-background', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '背景统一失败');
                }

                const blob = await response.blob();
                unifiedBlob = blob;
                const url = URL.createObjectURL(blob);
                bgUnifyPreviewImg.src = url;
                bgUnifyPreview.classList.add('show');

            } catch (err) {
                showError(err.message);
            } finally {
                bgUnifyBtn.textContent = '统一背景';
                bgUnifyBtn.disabled = false;
            }
        });

        // 处理图像
        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            hideError();
            loading.classList.add('show');
            processBtn.disabled = true;

            const formData = new FormData();
            const inputBlob = (bgUnifyToggle.checked && unifiedBlob) ? unifiedBlob : selectedFile;
            const inputName = (bgUnifyToggle.checked && unifiedBlob) ? 'unified.png' : selectedFile.name;
            formData.append('image', inputBlob, inputName);
            formData.append('cell_size', cellSize.value);

            try {
                const response = await fetch('/pixelize', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '处理失败');
                }

                const blob = await response.blob();
                pixelatedBlob = blob;
                const resultUrl = URL.createObjectURL(blob);
                resultImage.src = resultUrl;
                resultSection.classList.add('show');

                // 如果使用了背景统一，显示统一结果列
                if (bgUnifyToggle.checked && unifiedBlob) {
                    unifiedBox.style.display = 'block';
                    unifiedImage.src = URL.createObjectURL(unifiedBlob);
                } else {
                    unifiedBox.style.display = 'none';
                }

                // 计算并显示颜色数
                const imgEl = new Image();
                imgEl.onload = () => {
                    const colorCount = countColors(imgEl);
                    colorInfo.textContent = `当前颜色数: ${colorCount}`;
                    const target = parseInt(targetColors.value);
                    optimizeBtn.disabled = colorCount <= target;
                    if (colorCount <= target) {
                        colorInfo.textContent += ` (已满足目标 ${target})`;
                    }
                };
                imgEl.src = resultUrl;

                // 隐藏之前的优化结果
                optimizedBox.style.display = 'none';

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('show');
                processBtn.disabled = false;
            }
        });

        // 下载原始尺寸图像
        downloadBtn.addEventListener('click', async () => {
            if (!pixelatedBlob) return;

            const url = URL.createObjectURL(pixelatedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pixelized_${cellSize.value}_${selectedFile.name}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 统计图像颜色数
        function countColors(imgEl) {
            const canvas = document.createElement('canvas');
            canvas.width = imgEl.naturalWidth;
            canvas.height = imgEl.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgEl, 0, 0);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const colors = new Set();
            for (let i = 0; i < data.length; i += 4) {
                colors.add((data[i] << 16) | (data[i+1] << 8) | data[i+2]);
            }
            return colors.size;
        }

        // 颜色优化
        optimizeBtn.addEventListener('click', async () => {
            if (!pixelatedBlob) return;

            const target = parseInt(targetColors.value);
            if (target < 2 || target > 256) {
                showError('目标颜色数必须在 2-256 之间');
                return;
            }

            hideError();
            optimizeBtn.disabled = true;
            optimizeBtn.textContent = '优化中...';

            const formData = new FormData();
            formData.append('image', pixelatedBlob, 'pixelated.png');
            formData.append('target_colors', target);

            try {
                const response = await fetch('/optimize-colors', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '优化失败');
                }

                const blob = await response.blob();
                optimizedBlob = blob;
                const url = URL.createObjectURL(blob);
                optimizedImage.src = url;
                optimizedBox.style.display = 'block';

                // 统计优化后的颜色数
                const imgEl = new Image();
                imgEl.onload = () => {
                    const colorCount = countColors(imgEl);
                    optimizedColorInfo.textContent = `优化后颜色数: ${colorCount} (目标: ${target})`;
                };
                imgEl.src = url;

            } catch (err) {
                showError(err.message);
            } finally {
                optimizeBtn.textContent = '颜色优化';
                optimizeBtn.disabled = false;
            }
        });

        // 下载优化图像（原始像素网格尺寸）
        downloadOptimizedBtn.addEventListener('click', async () => {
            if (!optimizedBlob) return;

            const target = parseInt(targetColors.value);
            const url = URL.createObjectURL(optimizedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `optimized_${target}colors_${selectedFile.name}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        function hideError() {
            error.classList.remove('show');
        }

        // 缩放控制
        const zoomScales = {};
        const ZOOM_STEP = 2;  // 每次放大/缩小 2 倍

        function zoom(imgId, direction) {
            const img = document.getElementById(imgId);
            const label = document.getElementById('zoom-' + imgId);
            if (!zoomScales[imgId]) zoomScales[imgId] = 1;

            if (direction === 0) {
                zoomScales[imgId] = 1;
            } else {
                zoomScales[imgId] *= (direction > 0 ? ZOOM_STEP : 1 / ZOOM_STEP);
                zoomScales[imgId] = Math.max(0.25, Math.min(zoomScales[imgId], 32));
            }

            const scale = zoomScales[imgId];
            img.style.width = (scale * 100) + '%';
            label.textContent = Math.round(scale * 100) + '%';
        }
    </script>
</body>
</html>
